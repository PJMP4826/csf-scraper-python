[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "csf-scraper"
version = "0.1.0"
description = "Obtiene los datos fiscales actuales de una persona moral o física dado su RFC y su idCIF (port de phpcfdi/csf-scraper)"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Cesar Aguilera", email = "cesargnu29@gmail.com" },
    { name = "Misael Limón", email = "misael.limon@ocelotlstudio.com" },
    { name = "Fernando Isidro", email = "fernando.isidro@ocelotlstudio.com" },
]
keywords = ["phpcfdi", "sat", "csf", "rfc", "scraper"]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "llama-index-core>=0.14",
    "lxml>=5.0",
    "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/phpcfdi/csf-scraper"
Issues = "https://github.com/phpcfdi/csf-scraper/issues"
Source = "https://github.com/phpcfdi/csf-scraper"

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "respx>=0.22",
    "ruff>=0.6",
]
llm-gemini = ["llama-index-llms-google-genai>=0.6"]
llm-deepseek = ["llama-index-llms-deepseek>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/csf_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
files = ["src"]
